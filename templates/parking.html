<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>실태확인 출장 - 무료주차장 매칭</title>
<style>
:root {
  --bg: #0a0e14;
  --surface: #131922;
  --surface-2: #1a2230;
  --border: #232d3f;
  --text: #e6edf3;
  --text-dim: #8a96a8;
  --accent: #58d68d;
  --accent-2: #5dade2;
  --warn: #f7c873;
  --danger: #e74c3c;
  --tag-24h: #2ecc71;
  --tag-free: #3498db;
  --tag-holiday: #9b59b6;
  --tag-limit: #95a5a6;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
  font-size: 15px; line-height: 1.5;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 80px; }
header {
  border-bottom: 1px solid var(--border);
  padding-bottom: 14px; margin-bottom: 16px;
}
.nav-back {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--text-dim);
  text-decoration: none; margin-bottom: 10px;
}
.nav-back:hover { color: var(--text); }
h1 { margin: 0 0 4px; font-size: 19px; font-weight: 700; }
.sub { font-size: 12px; color: var(--text-dim); }

.input-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 14px;
}
label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text-dim); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 7px;
  font-size: 14px;
  font-family: inherit;
  min-height: 130px;
  resize: vertical;
  line-height: 1.6;
}
textarea:focus { outline: none; border-color: var(--accent-2); }
.controls {
  display: flex; gap: 8px; margin-top: 10px;
  align-items: center; flex-wrap: wrap;
}
.controls label.inline {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--text-dim);
  text-transform: none; letter-spacing: 0;
  margin: 0; cursor: pointer;
}
.controls select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 8px;
  border-radius: 5px;
  font-size: 12px;
  font-family: inherit;
}
.btn-run {
  padding: 8px 16px;
  background: var(--accent);
  color: #0a0e14;
  border: none; border-radius: 7px;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  flex: 0 0 auto;
}
.btn-run:active { opacity: 0.8; }
.btn-clear {
  padding: 8px 12px;
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 12px;
  cursor: pointer;
}
.hint {
  font-size: 11px; color: var(--text-dim);
  margin-top: 8px; line-height: 1.5;
}

.visit-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 12px;
  overflow: hidden;
}
.visit-head {
  padding: 12px 14px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 10px;
}
.visit-num {
  flex: 0 0 auto;
  width: 26px; height: 26px;
  background: var(--accent-2);
  color: #0a0e14;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px;
}
.visit-info { flex: 1; min-width: 0; }
.visit-addr {
  font-weight: 600; font-size: 14px; color: var(--text);
  word-break: keep-all; line-height: 1.4;
}
.visit-meta {
  font-size: 11px; color: var(--text-dim);
  margin-top: 3px;
}
.visit-meta b { color: var(--warn); font-weight: 600; }
.visit-actions {
  margin-top: 6px; display: flex; gap: 6px;
}
.mini-btn {
  font-size: 11px;
  padding: 4px 8px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 5px;
  text-decoration: none;
  cursor: pointer;
}
.mini-btn:hover { color: var(--text); }

.matches {
  padding: 4px 0;
}
.no-match {
  padding: 18px 14px;
  text-align: center;
  font-size: 12px;
  color: var(--text-dim);
}
.lot {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.lot:last-child { border-bottom: none; }
.lot-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 10px; margin-bottom: 4px;
}
.lot-name {
  font-weight: 600; font-size: 14px;
  display: flex; align-items: center; gap: 6px;
}
.match-badge {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.match-dong { background: rgba(88,214,141,0.18); color: var(--accent); }
.match-gu { background: rgba(247,200,115,0.15); color: var(--warn); }
.lot-cap {
  font-size: 11px; color: var(--text-dim);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.lot-cap b { color: var(--accent); }
.lot-addr {
  font-size: 12px; color: var(--text-dim);
  margin-bottom: 5px;
}
.lot-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
.tag {
  font-size: 10px; font-weight: 600;
  padding: 1px 6px; border-radius: 7px;
}
.tag-mode-24시간 { background: rgba(46,204,113,0.15); color: var(--tag-24h); }
.tag-mode-상시무료 { background: rgba(52,152,219,0.15); color: var(--tag-free); }
.tag-mode-공휴일무료 { background: rgba(155,89,182,0.15); color: var(--tag-holiday); }
.tag-mode-제한운영 { background: rgba(149,165,166,0.15); color: var(--tag-limit); }
.tag-type { background: var(--surface-2); color: var(--text-dim); }
.lot-hours {
  font-size: 11px; color: var(--text-dim);
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}
.lot-hours span { margin-right: 10px; }
.lot-hours b { color: var(--text); font-weight: 500; }
.lot-map {
  display: inline-block;
  font-size: 11px; font-weight: 600;
  padding: 5px 10px;
  background: var(--accent-2);
  color: #0a0e14;
  border-radius: 5px;
  text-decoration: none;
}

.summary {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: 12px;
}
.summary-row {
  display: flex; justify-content: space-between;
  padding: 3px 0; color: var(--text-dim);
}
.summary-row b { color: var(--text); font-weight: 600; }

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: #0a0e14;
  padding: 10px 18px; border-radius: 20px;
  font-size: 13px; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s; z-index: 200;
}
.toast.show { opacity: 1; }
</style>
</head>

<div class="wrap">
  <header>
    <a class="nav-back" href="/">← 일정표로 돌아가기</a>
    <h1>🅿️ 실태확인 출장 무료주차장 매칭</h1>

  </header>

  <div class="input-card">

          <option value="5" selected>5</option>

        </select>
      </label>
    </div>
    <div class="hint">
      • 동까지 적힌 주소는 같은 동 → 같은 구 순으로 매칭<br>
      • 도로명 주소(예: "테헤란로 123")는 구 단위로만 매칭<br>
      • 결과 카드의 "카카오맵" 버튼은 카카오 내비 연동 가능
    </div>
  </div>

  <div id="output"></div>
</div>
<div class="toast" id="toast"></div>

function extractGu(addr) {
  const m = addr.match(/(\S+구)/);
  return m ? m[1] : '';
}

function extractDong(addr) {
  const m = addr.match(/구\s+(\S+?동)(?:\b|\s|\d)/);
  if (m) {
    const candidate = m[1];
    const afterDong = addr.substring(addr.indexOf(candidate) + candidate.length, addr.indexOf(candidate) + candidate.length + 2);
    if (afterDong.startsWith('로') || afterDong.startsWith('길')) return '';
    return candidate;
  }
  return '';
}

function match(addr) {
  const gu = extractGu(addr);
  const dong = extractDong(addr);
  if (!gu) return { gu: '', dong: '', dong_match: [], gu_match: [] };
  const dong_match = dong ? PARKING.filter(p => p.gu === gu && p.dong === dong) : [];
  const gu_match = PARKING.filter(p => p.gu === gu && !dong_match.includes(p));
  return { gu, dong, dong_match, gu_match };
}

function sortLots(lots, prioritize24h) {
  const order = prioritize24h
    ? { '24시간': 0, '상시무료': 1, '공휴일무료': 2, '제한운영': 3 }
    : { '24시간': 1, '상시무료': 1, '공휴일무료': 1, '제한운영': 1 };
  return [...lots].sort((a, b) => {
    const oa = order[a.mode] ?? 9;
    const ob = order[b.mode] ?? 9;
    if (oa !== ob) return oa - ob;
    return b.cap - a.cap;
  });
}

function lotCard(p, badge) {
  const cap = p.cap > 0 ? `<span class="lot-cap"><b>${p.cap}</b>면</span>` : '';
  return `
    <div class="lot">
      <div class="lot-head">
        <div class="lot-name">
          ${p.name}
          <span class="match-badge match-${badge}">${badge === 'dong' ? '동일치' : '구일치'}</span>
        </div>
        ${cap}
      </div>
      <div class="lot-addr">${p.addr}</div>
      <div class="lot-tags">
        <span class="tag tag-mode-${p.mode}">${p.mode}</span>
        <span class="tag tag-type">${p.type}</span>
      </div>
      <div class="lot-hours">
        <span>평일 <b>${p.wd}</b></span>
        <span>토 <b>${p.sat}</b></span>
        <span>휴일 <b>${p.hol}</b></span>
      </div>
      <a class="lot-map" href="${p.map}" target="_blank" rel="noopener">🗺 카카오맵 열기</a>
    </div>
  `;
}

function visitBlock(addr, idx, opts) {
  const r = match(addr);
  const prioritize = opts.only24;
  const N = opts.topN;
  const dongLots = sortLots(r.dong_match, prioritize).slice(0, N);
  const guLots = sortLots(r.gu_match, prioritize).slice(0, Math.max(0, N - dongLots.length));
  const visitMap = `https://map.kakao.com/?q=${encodeURIComponent(addr)}`;

  let meta = '';
  if (r.gu) meta += `<b>${r.gu}</b>`;
  if (r.dong) meta += ` · <b>${r.dong}</b>`;
  if (!r.gu) meta = '<span style="color:var(--danger)">구 인식 실패 — 직접 검색 필요</span>';

  let body;
  if (!r.gu) {
    body = `<div class="no-match">서울시 구가 인식되지 않았습니다</div>`;
  } else if (dongLots.length === 0 && guLots.length === 0) {
    body = `<div class="no-match">${r.gu} 내 면제주차장이 목록에 없습니다</div>`;
  } else {
    body = '<div class="matches">';
    dongLots.forEach(p => body += lotCard(p, 'dong'));
    guLots.forEach(p => body += lotCard(p, 'gu'));
    body += '</div>';
  }

  return `
    <div class="visit-block">
      <div class="visit-head">
        <div class="visit-num">${idx + 1}</div>
        <div class="visit-info">
          <div class="visit-addr">${addr}</div>
          <div class="visit-meta">${meta}</div>
          <div class="visit-actions">
            <a class="mini-btn" href="${visitMap}" target="_blank" rel="noopener">🗺 방문지 검색</a>
            <button class="mini-btn copy-btn" data-addr="${addr.replace(/"/g,'&quot;')}">📋 복사</button>
          </div>
        </div>
      </div>
      ${body}
    </div>
  `;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1500);
}

function run() {
  const raw = document.getElementById('inputAddr').value;
  const addrs = raw.split('\n').map(s => s.trim()).filter(Boolean);
  const opts = {
    only24: document.getElementById('only24').checked,
    topN: parseInt(document.getElementById('topN').value, 10),
  };
  if (addrs.length === 0) {
    document.getElementById('output').innerHTML = '';
    return;
  }
  const guCounts = {};
  let matched = 0;
  addrs.forEach(a => {
    const r = match(a);
    if (r.gu) {
      guCounts[r.gu] = (guCounts[r.gu] || 0) + 1;
      if (r.dong_match.length + r.gu_match.length > 0) matched++;
    }
  });
  const summary = `
    <div class="summary">
      <div class="summary-row"><span>방문지</span><b>${addrs.length}곳</b></div>
      <div class="summary-row"><span>매칭 성공</span><b>${matched}곳</b></div>
      <div class="summary-row"><span>분포</span><b>${Object.entries(guCounts).map(([g,c]) => `${g} ${c}`).join(', ') || '-'}</b></div>
    </div>
  `;
  const blocks = addrs.map((a, i) => visitBlock(a, i, opts)).join('');
  document.getElementById('output').innerHTML = summary + blocks;
  document.querySelectorAll('.copy-btn').forEach(b => {
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(b.dataset.addr); showToast('복사됨'); }
      catch (e) { showToast('복사 실패'); }
    });
  });
}

document.getElementById('runBtn').addEventListener('click', run);
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('inputAddr').value = '';
  document.getElementById('output').innerHTML = '';
});
document.getElementById('inputAddr').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run();
});
document.getElementById('only24').addEventListener('change', () => {
  if (document.getElementById('output').innerHTML) run();
});
document.getElementById('topN').addEventListener('change', () => {
  if (document.getElementById('output').innerHTML) run();
});
</script>
